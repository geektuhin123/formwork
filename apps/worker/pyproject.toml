[project]
name = "formwork-worker"
version = "0.1.0"
description = "Formwork worker package"
requires-python = ">=3.12"
dependencies = [
  "formwork-core",
  "formwork-pipeline",
  "arq>=0.26",
  "redis>=5.0",
  "httpx>=0.27",
]

[tool.uv.sources]
formwork-core = { workspace = true }
formwork-pipeline = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formwork_worker"]
