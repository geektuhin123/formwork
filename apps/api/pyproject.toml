[project]
name = "formwork-api"
version = "0.1.0"
description = "Formwork api package"
requires-python = ">=3.12"
dependencies = [
  "formwork-core",
  "formwork-pipeline",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "arq>=0.26",
  "redis>=5.0",
]

[project.scripts]
formwork-admin = "formwork_api.admin:main"

[tool.uv.sources]
formwork-core = { workspace = true }
formwork-pipeline = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formwork_api"]
