name: ci
on:
  push: { branches: [main] }
  pull_request:

concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: formwork, POSTGRES_PASSWORD: formwork, POSTGRES_DB: formwork_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U formwork" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FORMWORK_TEST_DATABASE_ADMIN_URL: postgresql+psycopg://formwork:formwork@localhost:5432/formwork_test
      FORMWORK_TEST_DATABASE_URL: postgresql+psycopg://formwork_app:formwork_app@localhost:5432/formwork_test
      PGPASSWORD: formwork
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng redis-server postgresql-client
      - run: psql -h localhost -U formwork -d formwork_test -c "CREATE ROLE formwork_app LOGIN PASSWORD 'formwork_app'"
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy packages apps
      - name: Tests
        run: uv run pytest -q -m "not e2e"
      - name: Eval gate (offline unless ANTHROPIC_API_KEY is configured)
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: uv run python evals/run_eval.py --all --gate --reports "$RUNNER_TEMP/eval"
      - name: OpenAPI spec is current
        run: uv run python scripts/export_openapi.py && git diff --exit-code docs/openapi.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: "${{ runner.temp }}/eval" }

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  images:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t formwork-api .
      - run: docker build -f apps/worker/Dockerfile -t formwork-worker .
      - run: docker build -t formwork-web apps/web
