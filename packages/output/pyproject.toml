[project]
name = "formwork-output"
version = "0.1.0"
description = "Formwork output package"
requires-python = ">=3.12"
dependencies = [
  "formwork-core",
  "openpyxl>=3.1",
]

[tool.uv.sources]
formwork-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formwork_output"]
