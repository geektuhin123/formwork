[project]
name = "formwork-router"
version = "0.1.0"
description = "Formwork router package"
requires-python = ">=3.12"
dependencies = [
  "formwork-core",
]

[tool.uv.sources]
formwork-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formwork_router"]
