[project]
name = "formwork-testkit"
version = "0.1.0"
description = "Formwork testkit package"
requires-python = ">=3.12"
dependencies = [
  "formwork-core",
  "reportlab>=4.2",
  "openpyxl>=3.1",
  "pillow>=10.3",
  "pymupdf>=1.24",
  "python-docx>=1.1",
]

[tool.uv.sources]
formwork-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formwork_testkit"]
