[project]
name = "formwork-extract"
version = "0.1.0"
description = "Formwork extract package"
requires-python = ">=3.12"
dependencies = [
  "formwork-core",
  "formwork-router",
  "rapidfuzz>=3.9",
  "polars>=1.0",
  "python-dateutil>=2.9",
]

[tool.uv.sources]
formwork-core = { workspace = true }
formwork-router = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formwork_extract"]
