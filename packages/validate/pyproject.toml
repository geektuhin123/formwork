[project]
name = "formwork-validate"
version = "0.1.0"
description = "Formwork validate package"
requires-python = ">=3.12"
dependencies = [
  "formwork-core",
  "simpleeval>=1.0",
  "python-dateutil>=2.9",
]

[tool.uv.sources]
formwork-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formwork_validate"]
