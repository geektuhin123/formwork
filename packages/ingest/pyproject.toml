[project]
name = "formwork-ingest"
version = "0.1.0"
description = "Formwork ingest package"
requires-python = ">=3.12"
dependencies = [
  "formwork-core",
  "pymupdf>=1.24",
  "pytesseract>=0.3.10",
  "pillow>=10.3",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "opencv-python-headless>=4.9",
  "numpy>=2.0",
]

[project.scripts]
ingest = "formwork_ingest.cli:main"

[tool.uv.sources]
formwork-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formwork_ingest"]
