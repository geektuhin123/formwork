[project]
name = "formwork-merge"
version = "0.1.0"
description = "Formwork merge package"
requires-python = ">=3.12"
dependencies = [
  "formwork-core",
  "formwork-extract",
  "rapidfuzz>=3.9",
]

[tool.uv.sources]
formwork-core = { workspace = true }
formwork-extract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formwork_merge"]
