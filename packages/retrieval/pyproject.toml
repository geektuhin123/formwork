[project]
name = "formwork-retrieval"
version = "0.1.0"
description = "Formwork retrieval package"
requires-python = ">=3.12"
dependencies = [
  "formwork-core",
  "numpy>=2.0",
]

[tool.uv.sources]
formwork-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formwork_retrieval"]
