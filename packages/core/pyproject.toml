[project]
name = "formwork-core"
version = "0.1.0"
description = "Formwork core package"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "anthropic>=0.40",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "structlog>=24.1",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "boto3>=1.34",
  "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formwork_core"]
