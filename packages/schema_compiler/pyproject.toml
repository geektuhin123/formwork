[project]
name = "formwork-schema-compiler"
version = "0.1.0"
description = "Formwork schema_compiler package"
requires-python = ">=3.12"
dependencies = [
  "formwork-core",
  "pandas>=2.2",
  "openpyxl>=3.1",
]

[tool.uv.sources]
formwork-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formwork_schema_compiler"]
