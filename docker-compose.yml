# Local stack. `docker compose up -d` gives Postgres+pgvector, Redis, MinIO, the API, a worker and the web console.
x-app-env: &app-env
  FORMWORK_ENV: dev
  FORMWORK_LOG_JSON: "true"
  FORMWORK_DATABASE_URL: postgresql+psycopg://formwork_app:formwork_app@postgres:5432/formwork
  FORMWORK_DATABASE_ADMIN_URL: postgresql+psycopg://formwork:formwork@postgres:5432/formwork
  FORMWORK_REDIS_URL: redis://redis:6379/0
  FORMWORK_QUEUE: arq
  FORMWORK_OBJECT_STORE: s3
  FORMWORK_S3_ENDPOINT_URL: http://minio:9000
  FORMWORK_S3_BUCKET: formwork
  FORMWORK_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  FORMWORK_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  FORMWORK_API_KEY_PEPPER: ${FORMWORK_API_KEY_PEPPER:-dev-only-pepper-change-me}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: formwork
      POSTGRES_PASSWORD: formwork
      POSTGRES_DB: formwork
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formwork -d formwork"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin}
      && mc mb --ignore-existing local/formwork"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  web:
    build: { context: apps/web }
    environment:
      FORMWORK_API_URL: http://api:8000
      FORMWORK_API_KEY: ${FORMWORK_API_KEY:-}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
